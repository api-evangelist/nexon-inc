name: Nexon Inc
description: 'Nexon (operated by Nexon Korea Co., Ltd.) is a global video game publisher whose
  NEXON Open API platform at openapi.nexon.com gives developers programmatic access to per-game
  data such as character, ranking, and match information. Requests are authenticated with a
  per-application API key sent in the x-nxopen-api-key HTTP header and served from open.api.nexon.com;
  the developer portal provides application registration, usage analytics, per-game API references,
  and integration guides.'
